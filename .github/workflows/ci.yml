name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Build, Astro check, typecheck, unit test, format, token check, audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Astro check (.astro + .tsx)
        # astro check menutup celah tsc: error di frontmatter .astro dan
        # tipe JSX island tidak pernah dilihat `tsc -p tsconfig.json`.
        run: npm run check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit test (worker/lib.ts)
        # Menguji jaring pengaman kebocoran prompt, transformasi SSE, dan
        # sesi bertanda tangan — logika worker yang tak terlihat build statis.
        run: npm test
      - name: Format check (Prettier)
        run: npm run format:check
      - name: Token check
        run: npm run check:tokens
      - name: Dependency audit
        # Moderate vuln transitif di dev tooling (glob/minimatch via sentry,
        # fast-uri) tidak memblokir deploy — hanya high/critical yang diblokir.
        run: npm audit --audit-level=high --omit=dev

  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: quality
    # Hanya deploy saat push ke main, bukan saat PR (PR tak boleh deploy).
    # workflow_dispatch juga diizinkan untuk deploy manual darurat.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 32c06f32e612106d913a301c68888b10
        run: npx wrangler deploy
