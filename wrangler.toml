# Cloudflare Workers — mifdlal.com
# Deploy: npm run deploy  (= wrangler deploy)
# Preview lokal: npm run preview

name = "mifdlal"
main = "worker/index.ts"
compatibility_date = "2026-10-17"

# Custom domain — mifdlal.com sudah terdaftar di akun Cloudflare ini.
# Saat deploy, wrangler akan membuat/update route dan attach domain
# ke worker ini secara otomatis.
[[routes]]
pattern = "mifdlal.com"
custom_domain = true

[[routes]]
pattern = "www.mifdlal.com"
custom_domain = true

# API chat (POST /api/chat): streaming dari OpenRouter.
# Kunci TIDAK di git — pasang dengan:
#   npx wrangler secret put OPENROUTER_API_KEY
# Model override (opsional):
#   npx wrangler secret put CHAT_MODEL
# [vars]
# CHAT_MODEL = "google/gemini-2.5-flash"

# Static assets: dilayani env.ASSETS dari worker entry.
# Semua non-/api/chat dioper ke assets — perilaku static
# (404 page, _headers CSP) tidak berubah.
[assets]
directory = "./dist"
not_found_handling = "404-page"
run_worker_first = false